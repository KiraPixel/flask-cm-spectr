name: Build & Push

on:
  push:
    branches:
      - main
      - no_ui_app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          DATE=$(date +%Y%m%d%H%M%S)

          if [ "${{ github.ref_name }}" = "no_ui_app" ]; then
            echo "TAG=no-ui_$DATE" >> $GITHUB_ENV
          else
            echo "TAG=$DATE" >> $GITHUB_ENV
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/kirapixel/${{ github.event.repository.name }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}